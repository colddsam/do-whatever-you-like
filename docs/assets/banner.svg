<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Do-Whatever-You-Like</title>
  <desc id="d">One place to do whatever you need: 218 free online tools, no sign-up, nothing to install.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e2ddd0" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset=".18" stop-color="#fbfaf6" stop-opacity="0"/>
      <stop offset=".82" stop-color="#fbfaf6" stop-opacity="0"/>
      <stop offset="1" stop-color="#fbfaf6"/>
    </linearGradient>
    <clipPath id="list"><rect x="760" y="138" width="440" height="216" rx="4"/></clipPath>
    <clipPath id="typed"><rect class="type" x="810" y="92" width="0" height="26"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#15140f" flood-opacity=".12"/>
    </filter>
  </defs>
  <style>
    .sans { font-family: Inter, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .serif { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-style: italic; }
    .mono { font-family: "Geist Mono", "SF Mono", Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s } .d5 { animation-delay: .9s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .rows { animation: scroll 28s linear infinite; }
    @keyframes scroll { from { transform: translateY(0) } to { transform: translateY(-576px) } }
    .type { animation: type 7s steps(16) infinite; }
    @keyframes type { 0% { width: 0 } 35%, 80% { width: 140px } 92%, 100% { width: 0 } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 50% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) { .rows, .type, .caret, .pulse, .rise { animation: none; opacity: 1; } .type { width: 140px } }
  </style>

  <rect width="1280" height="420" fill="#f3f0e8"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Brand -->
  <g class="rise d1">
    <rect x="80" y="74" width="44" height="44" rx="10" fill="#15140f"/>
    <path d="M91 96.5l7.5 7.5 14-15" fill="none" stroke="#f3f0e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="119" cy="113" r="5" fill="#eb4a10"/>
    <text x="138" y="105" class="sans" font-size="24" font-weight="600" fill="#15140f">Do-Whatever-You-Like</text>
  </g>
  <g class="rise d2">
    <text x="78" y="196" class="sans" font-size="62" font-weight="600" letter-spacing="-2" fill="#15140f">One place to do</text>
    <text x="78" y="262" font-size="66" letter-spacing="-1"><tspan class="serif" fill="#eb4a10">whatever</tspan><tspan class="sans" font-weight="600" letter-spacing="-2" fill="#15140f"> you need.</tspan></text>
  </g>
  <g class="rise d3">
    <text x="80" y="310" class="sans" font-size="18" fill="#57544a">218 free tools for files, PDFs, media, code, charts and more.</text>
  </g>
  <g class="rise d4 mono" font-size="12" letter-spacing="1.5" fill="#8a867a">
    <text x="80" y="362">0 SIGN-UPS</text>
    <text x="210" y="362">0 WATERMARKS</text>
    <text x="360" y="362">FILES DELETED AFTER USE</text>
    <rect x="80" y="337" width="520" height="1" fill="#dad5c8"/>
  </g>

  <!-- Palette card -->
  <g class="rise d3" filter="url(#shadow)">
    <rect x="740" y="70" width="460" height="300" rx="16" fill="#fbfaf6" stroke="#dad5c8"/>
  </g>
  <g class="rise d4">
    <circle cx="783" cy="105" r="7" fill="none" stroke="#8a867a" stroke-width="2"/>
    <path d="M788 110l5 5" stroke="#8a867a" stroke-width="2" stroke-linecap="round"/>
    <g clip-path="url(#typed)"><text x="810" y="111" class="sans" font-size="17" fill="#15140f">merge two pdfs…</text></g>
    <rect class="caret" x="952" y="94" width="2" height="22" fill="#eb4a10"/>
    <rect x="1124" y="93" width="54" height="24" rx="6" fill="none" stroke="#dad5c8"/>
    <text x="1151" y="110" text-anchor="middle" class="mono" font-size="11" fill="#8a867a">Ctrl K</text>
    <rect x="740" y="130" width="460" height="1" fill="#dad5c8"/>

    <g clip-path="url(#list)">
      <g class="rows">
        <!-- 16 rows of 36px, then the same 16 again for a seamless loop -->
        <g id="r" class="sans">
          <g transform="translate(0 150)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#15140f"/><text x="802" y="6" font-size="15" fill="#15140f">Universal converter</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 186)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Merge PDF</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 222)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Remove background</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 258)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">YouTube downloader</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 294)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Audio to text</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 330)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Chart maker</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 366)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Flowchart maker</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 402)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Noise remover</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 438)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Compress image</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 474)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">JSON formatter</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 510)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">QR generator</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 546)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Sign PDF</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 582)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Currency converter</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 618)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Video to GIF</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 654)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Markdown editor</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
          <g transform="translate(0 690)"><rect x="764" y="-12" width="26" height="26" rx="6" fill="#eae6db"/><text x="802" y="6" font-size="15" fill="#15140f">Password generator</text><circle cx="1124" cy="1" r="3.5" fill="#eb4a10"/><text x="1134" y="5" class="mono" font-size="11" fill="#57544a">LIVE</text></g>
        </g>
        <use href="#r" transform="translate(0 576)"/>
      </g>
    </g>
    <rect x="741" y="132" width="458" height="226" fill="url(#fade)"/>
  </g>
</svg>
